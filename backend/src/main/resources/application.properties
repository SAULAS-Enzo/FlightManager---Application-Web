# ----- Serveur -----
server.port=8080

# ----- Datasource MariaDB -----
spring.application.name=flightmanager
spring.datasource.url=jdbc:mariadb://localhost:3306/flightmanager
spring.datasource.username=root
spring.datasource.password=4118
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Met à jour le schéma à partir des entités JPA (ne supprime pas les données existantes)
spring.jpa.hibernate.ddl-auto=update

# Afficher les requêtes SQL et le débogage pour votre package
logging.level.fr.univ.orleans.saulas.flightmanager=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Log de Spring Security
logging.level.org.springframework.security=DEBUG